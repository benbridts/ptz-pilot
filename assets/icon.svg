<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#3a8dff"/>
			<stop offset="1" stop-color="#0d3b8c"/>
		</linearGradient>
		<linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="1" stop-color="#d9e4f5"/>
		</linearGradient>
	</defs>
	<!-- Tile, inset to Apple's icon grid -->
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

	<!-- Pan/tilt arrows -->
	<g fill="#ffffff" opacity="0.55">
		<path d="M512 170 l54 62 h-108 z"/>
		<path d="M512 854 l54 -62 h-108 z"/>
		<path d="M170 512 l62 -54 v108 z"/>
		<path d="M854 512 l-62 -54 v108 z"/>
	</g>

	<!-- Camera: base, yoke and head -->
	<path d="M392 742 h240 l-28 -64 h-184 z" fill="url(#body)"/>
	<rect x="492" y="640" width="40" height="44" fill="#c9d6ea"/>
	<path d="M352 470 v130 a40 40 0 0 0 40 40 h240 a40 40 0 0 0 40 -40 v-130" fill="none" stroke="url(#body)" stroke-width="44" stroke-linecap="round"/>
	<rect x="362" y="330" width="300" height="250" rx="70" fill="url(#body)"/>
	<circle cx="512" cy="455" r="92" fill="#0d3b8c"/>
	<circle cx="512" cy="455" r="62" fill="#1f5fd1"/>
	<circle cx="490" cy="433" r="18" fill="#ffffff" opacity="0.85"/>
</svg>
